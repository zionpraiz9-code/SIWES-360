{% extends "base.html" %}
{% block title %}Log in | SIWES360{% endblock %}
{% block content %}
<section class="form-card">
    <p class="eyebrow">Week 5 · Identity</p>
    <h1>Welcome back</h1>
    <p class="muted">Log in to continue to your SIWES360 workspace.</p>
    <form method="post" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>

        <button class="button" type="submit">Log in</button>
    </form>
    <p class="form-footer">Need an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
</section>
{% endblock %}
