{% extends "base.html" %}
{% block title %}Weekly Report | SIWES360{% endblock %}
{% block content %}
<section class="form-card"><p class="eyebrow">Student portal</p><h1>{{ 'Edit' if report else 'New' }} weekly report</h1><form method="post"><label for="week_number">Week</label><input id="week_number" name="week_number" type="number" min="1" value="{{ report.week_number if report else '' }}" required><label for="start_date">Start date</label><input id="start_date" name="start_date" type="date" value="{{ report.start_date.isoformat() if report else '' }}" required><label for="end_date">End date</label><input id="end_date" name="end_date" type="date" value="{{ report.end_date.isoformat() if report else '' }}" required><label for="summary">Summary</label><textarea id="summary" name="summary" required>{{ report.summary if report else '' }}</textarea><label for="challenges">Challenges</label><textarea id="challenges" name="challenges">{{ report.challenges if report else '' }}</textarea><label for="skills_acquired">Skills acquired</label><textarea id="skills_acquired" name="skills_acquired">{{ report.skills_acquired if report else '' }}</textarea><label for="supervisor_notes">Supervisor notes</label><textarea id="supervisor_notes" name="supervisor_notes">{{ report.supervisor_notes if report else '' }}</textarea><button class="button" type="submit">Save draft</button></form></section>
{% endblock %}
